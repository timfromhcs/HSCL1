[workspace]
resolver = "2"
members = [
    "crates/hcsuda-core",
    "crates/hcsuda-io",
    "crates/hcsuda-vk",
    "crates/hcsuda-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HCSMEDIA"]
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/timfromhcs/HSCL1"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
