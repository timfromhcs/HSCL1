[package]
name = "hscl"
description = "HSCL1 command line interface - Made with love by hcsmedia"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# `string` lets a page carry a computed title (`hscl-<command>`) without leaking a &'static str
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
