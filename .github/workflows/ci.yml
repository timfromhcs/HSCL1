name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  python-and-shell:
    name: Python tests, shell checks, design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tools
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends shellcheck python3-pytest python3-yaml
      - name: Design tokens (contrast) and generated QML theme in sync
        run: |
          python3 scripts/check-tokens.py
          python3 scripts/gen_qml_theme.py --check
      - name: Model catalog validates offline
        run: python3 scripts/build_model_catalog.py --offline-check
      - name: ShellCheck
        run: |
          shellcheck -S warning scripts/*.sh distro/live/*.sh distro/live/hooks/*.sh \
            packages/debian/*/build.sh packages/debian/hscl-workshop/usr/lib/hscl/workshop/evidence.sh \
            packages/debian/hscl-base/usr/bin/hcscoder
      - name: Tests
        run: python3 -m pytest tests -q

  qml:
    name: QML tests (wallpaper effects, Control Center)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Qt 6
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends cmake ninja-build build-essential \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates
      - name: Wallpaper effect tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/lib/qt6/bin/qmltestrunner -input tests/qml_plugin
      - name: Control Center build and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S apps/control-center -B build/cc -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cc
          ctest --test-dir build/cc --output-on-failure

  advisories:
    name: Rust dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit (locked)
        run: cargo install cargo-audit --locked  # unpinned on purpose: the advisory DB format moves (CVSS 4.0 broke 0.21.2)
      - name: Audit Cargo.lock (fails on known vulnerabilities, never skipped)
        run: cargo audit

  licenses:
    name: Rust licences and sources (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny (locked)
        run: cargo install cargo-deny --locked
      - name: Check licences, bans and sources (never skipped)
        run: cargo deny check licenses bans sources
