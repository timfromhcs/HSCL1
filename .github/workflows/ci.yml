name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  hcsuda:
    name: HCSUDA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: hcsuda
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # No GPU on a hosted runner: build.rs reports shaders as unavailable and
      # the GPU tests are not present as unit tests, so this is the CPU-only
      # gate (codecs, planner, oracle, report schema).
      - name: Tests (CPU only)
        run: cargo test --all
      - name: Dependency advisories
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked
          cargo audit

  python-and-shell:
    name: Python tests, shell checks, design tokens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the RSI guard needs the merge base with the target branch
      - name: Tools
        run: |
          fetch() { # download with a hard per-attempt limit; the last attempt leaves the Azure mirror (it stalled on the same package 3 times)
            for i in 1 2 3; do
              if sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --download-only --no-install-recommends "$@"; then return 0; fi
              echo "download attempt $i failed or stalled; partial files are resumed on the next attempt"
              if [ "$i" = 2 ]; then
                echo "switching the apt source from the mirror list to archive.ubuntu.com for the last attempt"
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#; s#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
                sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update || true
              fi
            done
            return 1
          }
          for i in 1 2 3; do sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break; done
          fetch shellcheck python3-pytest python3-yaml
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck python3-pytest python3-yaml
      - name: Design tokens (contrast) and generated QML theme in sync
        run: |
          python3 scripts/check-tokens.py
          python3 scripts/gen_qml_theme.py --check
      - name: Model catalog validates offline
        run: python3 scripts/build_model_catalog.py --offline-check
      - name: ShellCheck
        run: |
          shellcheck -S warning scripts/*.sh distro/live/*.sh distro/live/hooks/*.sh \
            packages/debian/*/build.sh packages/debian/hscl-workshop/usr/lib/hscl/workshop/evidence.sh \
            packages/debian/hscl-base/usr/bin/hcscoder
      - name: Tests
        run: python3 -m pytest tests -q
      - name: RSI guard (agent branches must not change the files that judge them)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'rsi/') || startsWith(github.head_ref, 'agent/'))
        env:
          HEAD_REF: ${{ github.head_ref }}   # via env, never interpolated into the script (branch names are attacker-controlled input)
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/protected_paths.py --base "origin/$BASE_REF" --branch "$HEAD_REF"

  hcseasymath:
    name: HCSEASYMATH (Python 3.14, hash-locked)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Gate (venv from requirements-test.lock, pip check, tests)
        run: bash scripts/hcseasymath_gate.sh

  qml:
    name: QML tests (wallpaper effects, Control Center)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Qt 6
        timeout-minutes: 10
        run: |
          fetch() { # download with a hard per-attempt limit; the last attempt leaves the Azure mirror (it stalled on the same package 3 times)
            for i in 1 2 3; do
              if sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --download-only --no-install-recommends "$@"; then return 0; fi
              echo "download attempt $i failed or stalled; partial files are resumed on the next attempt"
              if [ "$i" = 2 ]; then
                echo "switching the apt source from the mirror list to archive.ubuntu.com for the last attempt"
                sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#; s#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
                sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update || true
              fi
            done
            return 1
          }
          for i in 1 2 3; do sudo timeout 120 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && break; done
          fetch cmake ninja-build build-essential qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-templates
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build build-essential qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Wallpaper effect tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/lib/qt6/bin/qmltestrunner -input tests/qml_plugin
      - name: Control Center build and tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S apps/control-center -B build/cc -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cc
          ctest --test-dir build/cc --output-on-failure

  advisories:
    name: Rust dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit (locked)
        run: cargo install cargo-audit --locked  # unpinned on purpose: the advisory DB format moves (CVSS 4.0 broke 0.21.2)
      - name: Audit Cargo.lock (fails on known vulnerabilities, never skipped)
        run: cargo audit

  licenses:
    name: Rust licences and sources (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny (locked)
        run: cargo install cargo-deny --locked
      - name: Check licences, bans and sources (never skipped)
        run: cargo deny check licenses bans sources
