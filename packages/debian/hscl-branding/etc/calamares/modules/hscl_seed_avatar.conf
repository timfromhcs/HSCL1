# Runs right after Calamares' `users` module, inside the target chroot.
# Measured 2026-11-13 on rc12: the installed greeter showed the KDE gear instead of the HSCL1 mark because no
# AccountsService entry existed for the user (Q-44/Q-75). The script points Icon at the world-readable brand
# PNG; the home directory is 0750, so `.face.icon` inside it is unreadable for the greeter user.
dontChroot: false
timeout: 60
script:
  - "/usr/bin/hscl-seed-avatar"
