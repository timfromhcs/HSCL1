# HSCL1: act before the kernel OOM killer; never pick the desktop shell, compositor, login manager or the
# installer first. Calamares was SIGKILLed at 4 GB (exit 137, drkonqi died with it) while the same image
# installed fine at 6 GB — measured 2026-11-09. The installer is a short-lived, user-visible process and must
# not be the victim; real memory hogs (llama-server, node) stay preferred.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 5 -s 10 -r 3600 --avoid '(^|/)(plasmashell|kwin_wayland|kwin_x11|sddm|sddm-helper|Xorg|systemd|dbus-daemon|calamares|drkonqi)$' --prefer '(^|/)(llama-server|llama-cli|sd|node|opencode)$'
