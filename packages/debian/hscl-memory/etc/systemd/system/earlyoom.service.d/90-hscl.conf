# HSCL1: act before the kernel OOM killer; never pick the desktop shell, compositor or login manager first.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 5 -s 10 -r 3600 --avoid '(^|/)(plasmashell|kwin_wayland|kwin_x11|sddm|sddm-helper|Xorg|systemd|dbus-daemon)$' --prefer '(^|/)(llama-server|llama-cli|sd|node|opencode)$'
