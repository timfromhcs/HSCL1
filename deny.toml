# cargo-deny policy for HSCL1: licences compatible with GPL-3.0-or-later, no yanked crates, only crates.io as a source.
[graph]
all-features = true

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Unlicense",
  "LGPL-2.1-or-later", "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
